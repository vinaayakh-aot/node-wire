name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly — catches newly added queries against unchanged code.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read
  pull-requests: read
  security-events: write

jobs:
  analyze:
    name: Analyze (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Decide whether analysis is needed
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          bash .github/scripts/ci-pr-relevant.sh \
            '\.py$|\.pyi$|(^|/)src/|(^|/)packages/|(^|/)nw-mcp-builder/|(^|/)scripts/|^pyproject\.toml$|^uv\.lock$|\.github/workflows/codeql\.yml|\.github/codeql/|\.github/scripts/ci-pr-relevant\.sh'

      - name: Initialize CodeQL
        if: steps.gate.outputs.run == 'true'
        uses: github/codeql-action/init@8272c299f21ca24af15dfe9ac0971ba969e5e0d5 # v3.36.2
        with:
          languages: python
          # PRs: security-extended (faster). main / schedule: include quality queries.
          queries: ${{ github.event_name == 'pull_request' && 'security-extended' || 'security-and-quality' }}
          config-file: .github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        if: steps.gate.outputs.run == 'true'
        uses: github/codeql-action/analyze@8272c299f21ca24af15dfe9ac0971ba969e5e0d5 # v3.36.2
        with:
          category: "/language:python"

      - name: Skip CodeQL (no relevant changes)
        if: steps.gate.outputs.run != 'true'
        run: echo "No Python/source/config changes on this PR; skipping CodeQL."
