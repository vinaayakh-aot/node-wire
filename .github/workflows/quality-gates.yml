name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

# Bandit SAST on PRs that touch src/ (and on every push to main). The job
# always reports a status so required checks are not left pending.

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bandit:
    name: Bandit security scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Decide whether analysis is needed
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          bash .github/scripts/ci-pr-relevant.sh \
            '(^|/)src/|^pyproject\.toml$|scripts/bandit_report_summary\.py|\.github/workflows/quality-gates\.yml|\.github/scripts/ci-pr-relevant\.sh'

      - name: Install uv
        if: steps.gate.outputs.run == 'true'
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Resolve Bandit version from lockfile
        if: steps.gate.outputs.run == 'true'
        id: bandit-ver
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import tomllib

          data = tomllib.loads(pathlib.Path("uv.lock").read_text(encoding="utf-8"))
          version = next(p["version"] for p in data["package"] if p["name"] == "bandit")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version={version}\n")
          print(f"bandit=={version}")
          PY

      # Bandit exits non-zero when *any* finding exists (incl. low/medium). The
      # enforce step below gates on high only; use --exit-zero here so this step
      # always produces the JSON artifact and the job can print a summary.
      - name: Generate Bandit JSON report
        if: steps.gate.outputs.run == 'true'
        run: >
          uvx --from "bandit[toml]==${{ steps.bandit-ver.outputs.version }}"
          bandit -c pyproject.toml -r src -f json -o bandit-report.json --exit-zero

      - name: Bandit findings summary (log)
        if: steps.gate.outputs.run == 'true'
        run: python3 scripts/bandit_report_summary.py bandit-report.json

      - name: Upload Bandit report artifact
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: error

      - name: Enforce high-severity Bandit gate
        if: steps.gate.outputs.run == 'true'
        run: >
          uvx --from "bandit[toml]==${{ steps.bandit-ver.outputs.version }}"
          bandit -c pyproject.toml -r src --severity-level high

      - name: Skip Bandit (no relevant changes)
        if: steps.gate.outputs.run != 'true'
        run: echo "No src/Bandit-config changes on this PR; skipping Bandit."
