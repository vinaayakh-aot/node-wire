name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly — newly disclosed patterns against full history.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Cache Gitleaks binary
        id: cache-gitleaks
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ./gitleaks
          key: gitleaks-v8.27.2-linux-x64

      - name: Download Gitleaks
        if: steps.cache-gitleaks.outputs.cache-hit != 'true'
        env:
          GITLEAKS_SHA256: "141c3b2dede46d8b3a53b47116da756bd223decc0374797559a6b50ecba5590c"
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.27.2/gitleaks_8.27.2_linux_x64.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          rm gitleaks.tar.gz

      - name: Run Gitleaks
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! -x ./gitleaks ]]; then
            echo "::error::Gitleaks binary missing or not executable — cache may be corrupt"
            exit 1
          fi

          extra=()
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            extra+=(--log-opts="${PR_BASE}..${PR_HEAD}")
            echo "Scanning PR commit range ${PR_BASE}..${PR_HEAD}"
          elif [[ "${EVENT_NAME}" == "push" && "${PUSH_BEFORE}" != "0000000000000000000000000000000000000000" ]]; then
            extra+=(--log-opts="${PUSH_BEFORE}..${PUSH_SHA}")
            echo "Scanning push range ${PUSH_BEFORE}..${PUSH_SHA}"
          else
            echo "Scanning full git history"
          fi

          ./gitleaks detect --source . --redact --exit-code 1 "${extra[@]}"
