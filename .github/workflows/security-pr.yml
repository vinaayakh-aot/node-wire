name: Python package security PR checks

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/workflows/security-pr.yml"
      - ".github/workflows/publish.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "packages/**"
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_AUDIT_VERSION: "2.7.3"

jobs:
  decide:
    name: Select packages to audit
    runs-on: ubuntu-latest
    outputs:
      selected: ${{ steps.select.outputs.selected }}
    steps:
      - name: Select packages
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          ALL = [
              "packages/runtime",
              "packages/connectors/http_generic",
              "packages/connectors/stripe",
              "packages/connectors/smtp",
              "packages/connectors/google_drive",
              "packages/connectors/fhir_cerner",
              "packages/connectors/fhir_epic",
              "packages/connectors/salesforce",
              "packages/connectors/slack",
          ]

          def write_selected(paths: list[str]) -> None:
              payload = json.dumps(paths)
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
                  out.write("selected<<EOF\n")
                  out.write(f"{payload}\n")
                  out.write("EOF\n")
              print(f"packages to audit: {payload}")

          if os.environ.get("EVENT_NAME") != "pull_request":
              write_selected(ALL)
              raise SystemExit(0)

          repo = os.environ["REPO"]
          pr = os.environ["PR_NUMBER"]
          proc = subprocess.run(
              [
                  "gh", "api", "--paginate",
                  f"repos/{repo}/pulls/{pr}/files",
                  "--jq", ".[].filename",
              ],
              check=True,
              capture_output=True,
              text=True,
          )
          files = [line.strip() for line in proc.stdout.splitlines() if line.strip()]
          print("Changed files:")
          print("\n".join(files) if files else "(none)")

          if any(
              f in ("pyproject.toml", "uv.lock",
                    ".github/workflows/security-pr.yml",
                    ".github/workflows/publish.yml")
              or f.startswith("packages/runtime/")
              for f in files
          ):
              write_selected(ALL)
              raise SystemExit(0)

          selected = [
              pkg for pkg in ALL
              if any(f == pkg or f.startswith(pkg + "/") for f in files)
          ]
          write_selected(selected)
          PY

  vulnerability-scan:
    name: Vulnerability scan (${{ matrix.package_path }})
    needs: decide
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package_path:
          - packages/runtime
          - packages/connectors/http_generic
          - packages/connectors/stripe
          - packages/connectors/smtp
          - packages/connectors/google_drive
          - packages/connectors/fhir_cerner
          - packages/connectors/fhir_epic
          - packages/connectors/salesforce
          - packages/connectors/slack

    steps:
      - name: Fail if package selection failed
        if: needs.decide.result != 'success'
        run: |
          echo "Package selection job failed; cannot decide what to audit."
          exit 1

      - name: Skip audit (package unchanged)
        if: ${{ needs.decide.result == 'success' && !contains(fromJSON(needs.decide.outputs.selected || '[]'), matrix.package_path) }}
        run: echo "No dependency/metadata changes for ${{ matrix.package_path }}; skipping pip-audit."

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: needs.decide.result == 'success' && contains(fromJSON(needs.decide.outputs.selected || '[]'), matrix.package_path)

      - name: Set up Python
        if: needs.decide.result == 'success' && contains(fromJSON(needs.decide.outputs.selected || '[]'), matrix.package_path)
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            packages/runtime/pyproject.toml
            ${{ matrix.package_path }}/pyproject.toml

      # Connector packages declare node-wire-runtime>=1.0.0 as a PyPI-style dep; install
      # packages/runtime from the repo so pip resolves it without requiring a published wheel.
      - name: Install package and audit tool
        if: needs.decide.result == 'success' && contains(fromJSON(needs.decide.outputs.selected || '[]'), matrix.package_path)
        run: |
          python -m pip install --disable-pip-version-check --upgrade "setuptools>=78.1.1"
          python -m pip install --disable-pip-version-check "packages/runtime" "${{ matrix.package_path }}"
          python -m pip install --disable-pip-version-check "pip-audit==${{ env.PIP_AUDIT_VERSION }}"

      - name: Vulnerability scan (blocks any vulnerability)
        if: needs.decide.result == 'success' && contains(fromJSON(needs.decide.outputs.selected || '[]'), matrix.package_path)
        run: pip-audit
